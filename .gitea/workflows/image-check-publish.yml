name: Docker Image CI

# The publishing half of the pair: build, smoke gate, then log in and push.
#
# No `pull_request` trigger on purpose: this pushes :latest, which production follows (the container
# carries `io.portainer.update.enable`, so an updater redeploys whatever lands on it). PRs are covered
# by tests.yml, which builds the identical image and runs the identical gate but never pushes.
#
# Nobody approves between `docker push` and the rollout, and there are no tests in this repository:
# ci/smoke.py is the only check between a commit and the running bot.
on:
  workflow_dispatch:
  # Both names: a filter naming a non-existent branch silently stops triggering. The tag computation
  # below treats them alike.
  push:
    branches: [ "master", "main" ]
    # Root-level documentation must not move :latest and restart production. `*.md`, not `**.md`:
    # a markdown file under ci/ or .gitea/ must still trigger the gate.
    paths-ignore:
      - '*.md'

# No `packages: write`: it has no effect on Gitea Actions. The push authenticates with REGISTRY_TOKEN.
permissions:
  contents: read   # checkout

# Serialises runs on one ref so the newest commit's :latest is written last. Cancelling is off: it
# would kill the older run together with its :<sha> image, the rollback point for that commit.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # A label advertised by the instance-level self-hosted runner, not a machine name.
    runs-on: ubuntu-latest
    # Must exceed the step budgets (20 build + 30 smoke + 15 push = 65) plus the unbudgeted steps:
    # when the job timeout fires, `if: always()` cleanup steps are not guaranteed to run.
    timeout-minutes: 80
    # Job-level so ci/smoke.py (which names its containers after it) and the cleanup step agree.
    # The run id keeps concurrent runs on the shared daemon apart; ci/smoke.py refuses to start
    # without it.
    env:
      SMOKE_NAME: health-tracker-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # Default branch -> :latest + :<sha>; any other branch -> :<branch>. The branch names here must
      # match the `branches:` filter above.
      env:
        # Through the environment, not interpolated into the script: branch names may contain
        # `$(...)`, and the runner is self-hosted and shared.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Docker rejects uppercase letters in an image path. On this instance this resolves to
        # gitea.vvzvlad.xyz/projects/health_tracker; the stack's compose file hard-codes the same path.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "master" ] || [ "$REF_NAME" = "main" ]; then
          # Order matters: the push step goes left to right, so :latest moves only after :<sha>
          # (the rollback point) is in the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The gate tests the :<sha> tag, which can only mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Legal docker tag: [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}. Illegal characters become `-`, an
          # illegal first character becomes `_`, length is capped at 100.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch named `latest` must not produce the production tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # One pinned `pip install` on python:3.11-slim.
      timeout-minutes: 20
      env:
        # `$TAGS` is a space-separated list and is left unquoted below so it word-splits.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        set -e
        # Count after splitting: `[ -n "$TAGS" ]` would accept a whitespace-only value and build an
        # untagged image.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to build: the tag-computation step produced no usable output. Refusing to build an image that nothing could name, push or remove." >&2; exit 1; }
        tag_args=""
        for tag in "$@"; do tag_args="$tag_args --tag $tag"; done
        # --pull: the self-hosted runner's daemon is persistent, so without it a cached
        # python:3.11-slim base would never be refreshed.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The gate sits between build and push, so a red smoke publishes nothing.
      #
      # Read the module docstring in ci/smoke.py before changing the checks: nothing is bind-mounted
      # and no port is published (this job's filesystem and loopback are not the daemon's), so the
      # probe goes in on stdin; every container runs with `--network none`, so the real image boots
      # with a fake token without reaching Telegram.
      #
      # The runner's job image has `python3` but no `python`; inside the container it is `python`.
      #
      # ci/smoke.py's own worst case is 22 minutes (see the bounds block there; revisit both
      # together). A normal run takes under two minutes. If this timeout kills the script, the
      # `if: always()` step below removes the containers.
      timeout-minutes: 30
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The executable lines must match the same step in tests.yml (only `env:` differs);
      # ci/smoke.py checks this and fails the gate on drift.
      run: |
        python3 ci/smoke.py

    - name: Log in to the Gitea container registry
      # Logged in only after build and smoke, which run arbitrary code on a shared self-hosted
      # runner, so the credential is not in the docker config then.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with `write:package`, an organisation secret on `projects`. The built-in token has no
        # package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # Generous for a small image: too tight a bound would leave a half-pushed :<sha> and no :latest.
      timeout-minutes: 15
      env:
        # Unquoted below so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # A failed :<sha> push must stop the loop before :latest moves; set here rather than relying
        # on the runner's `bash -e` default.
        set -e
        # Count after splitting: a whitespace-only value would otherwise give a green step that
        # pushed nothing.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to push: the tag-computation step produced no usable output. Refusing to report a successful push that pushed nothing — :latest would stay on the previous image and look deployed." >&2; exit 1; }
        for tag in "$@"; do docker push "$tag"; done

    - name: Remove the smoke containers from the runner
      # The daemon is persistent and shared; a leftover container would also pin the image and make
      # the `docker rmi` below fail. ci/smoke.py removes its own containers, so this matters only
      # when a step was killed by its timeout.
      if: always()
      run: |
        # The suffixes from ALL_SUFFIXES in ci/smoke.py. Best-effort: no `set -e`.
        for suffix in -probe -boot-cloud -boot-served; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # Removes only this run's tags (no `docker system prune`: the daemon is shared). The BuildKit
      # cache and dangling base images left by `--pull` need a periodic cleanup on the runner host.
      if: always()
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS is fine here: nothing was built, nothing to remove.
        for tag in $TAGS; do docker rmi "$tag" || true; done

    - name: Log out of the Gitea container registry
      # `docker login` writes the credential into a docker config that outlives the job on this
      # shared runner; log out on every path. tests.yml never logs in.
      if: always()
      run: |
        # `|| true`: this also runs when the login never happened.
        docker logout gitea.vvzvlad.xyz || true
