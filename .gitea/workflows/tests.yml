name: PR checks

# The pull-request half of the pair: builds the identical image and runs the identical smoke gate as
# image-check-publish.yml, then throws the image away. No registry login, no push, no secrets.
#
# There are no tests in this repository, so everything the gate proves (the resolved dependencies
# import, the aiogram symbols exist, handlers register, migrations survive a legacy database, the
# health probe fails when it should) can only be checked against a built image.
on:
  pull_request:

permissions:
  contents: read   # checkout

# Cancelling is on here, unlike the publishing workflow: a superseded PR check produces nothing worth
# keeping, while there it would destroy the :<sha> rollback image.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A label advertised by the instance-level self-hosted runner, not a machine name.
    runs-on: ubuntu-latest
    # Must exceed the step budgets (20 build + 30 smoke = 50) plus the unbudgeted steps: when the
    # job timeout fires, `if: always()` cleanup steps are not guaranteed to run.
    timeout-minutes: 65
    # Job-level so ci/smoke.py and the cleanup step agree. The run id keeps concurrent runs (including
    # the publishing workflow) apart; ci/smoke.py refuses to start without it.
    env:
      SMOKE_NAME: health-tracker-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # Executable lines identical to image-check-publish.yml (ci/smoke.py checks this). On a
      # pull_request `github.ref_name` is the merge ref (`123/merge`), so this never yields :latest.
      env:
        # Through the environment, not interpolated into the script: branch names may contain
        # `$(...)`, and the runner is self-hosted and shared.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Docker rejects uppercase letters in an image path.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "master" ] || [ "$REF_NAME" = "main" ]; then
          # Order matters for the publishing workflow's push: :latest goes last.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Legal docker tag: [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}. Illegal characters become `-`, an
          # illegal first character becomes `_`, length is capped at 100.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch named `latest` must not produce the production tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # One pinned `pip install` on python:3.11-slim.
      timeout-minutes: 20
      env:
        # `$TAGS` is a space-separated list and is left unquoted below so it word-splits.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        set -e
        # Count after splitting: `[ -n "$TAGS" ]` would accept a whitespace-only value.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to build: the tag-computation step produced no usable output. Refusing to build an image that nothing could name, push or remove." >&2; exit 1; }
        tag_args=""
        for tag in "$@"; do tag_args="$tag_args --tag $tag"; done
        # --pull: the self-hosted runner's daemon is persistent, so without it a cached
        # python:3.11-slim base would never be refreshed.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The gate, on exactly the image a merge would publish.
      #
      # Read the module docstring in ci/smoke.py before changing the checks: nothing is bind-mounted
      # and no port is published, so the probe goes in on stdin; every container runs with
      # `--network none`, so a PR can boot the real image with a fake token without reaching Telegram.
      #
      # The runner's job image has `python3` but no `python`.
      #
      # ci/smoke.py's own worst case is 22 minutes (see the bounds block there; revisit both
      # together). If this timeout kills the script, the `if: always()` step below cleans up.
      timeout-minutes: 30
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The executable lines must match the same step in image-check-publish.yml (only `env:`
      # differs); ci/smoke.py checks this.
      run: |
        python3 ci/smoke.py

    - name: Remove the smoke containers from the runner
      # The daemon is persistent and shared; a leftover container would also pin the image. Matters
      # when a step was killed, which is likelier here because superseded runs are cancelled.
      if: always()
      run: |
        # The suffixes from ALL_SUFFIXES in ci/smoke.py. Best-effort: no `set -e`.
        for suffix in -probe -boot-cloud -boot-served; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # The image has no consumer after the gate. Removes only this run's tags (no
      # `docker system prune`: the daemon is shared).
      if: always()
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS is fine here: nothing was built, nothing to remove.
        for tag in $TAGS; do docker rmi "$tag" || true; done
